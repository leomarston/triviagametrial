<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{ margin:0; width:1024px; height:1024px; overflow:hidden; }
  .tile{
    width:1024px; height:1024px; border-radius:208px; overflow:hidden; position:relative;
    background:radial-gradient(circle at 50% 40%, #685AA0 0%, #574A8C 46%, #362C58 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .ring{ position:absolute; border:3px solid rgba(255,255,255,.05); border-radius:50%; }
  .glow{ position:absolute; width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle, rgba(248,212,91,.35), rgba(248,212,91,0) 62%); }
  img{ width:720px; position:relative; filter:drop-shadow(0 26px 44px rgba(20,12,40,.55)); }
  .rim{ position:absolute; inset:8px; border-radius:200px;
    box-shadow:inset 0 0 0 7px rgba(255,255,255,.08), inset 0 10px 34px rgba(255,255,255,.12); }
</style></head>
<body>
  <div class="tile">
    <div class="ring" style="width:540px;height:540px"></div>
    <div class="ring" style="width:780px;height:780px"></div>
    <div class="ring" style="width:1010px;height:1010px"></div>
    <div class="glow"></div>
    <img src="../assets/art/brand/mascot.svg" alt="">
    <div class="rim"></div>
  </div>
</body></html>
