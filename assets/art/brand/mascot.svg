<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" width="220" height="250">
  <defs>
    <radialGradient id="mGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FBE08A" stop-opacity=".75"/>
      <stop offset="55%" stop-color="#F8C24E" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#F8C24E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mBulb" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#FFFBEC"/>
      <stop offset="58%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#F9CB5E"/>
    </radialGradient>
    <linearGradient id="mBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFD6E0"/><stop offset="100%" stop-color="#9AA6B6"/>
    </linearGradient>
    <linearGradient id="mArm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBD46B"/><stop offset="100%" stop-color="#EBAE3A"/>
    </linearGradient>
  </defs>

  <ellipse cx="110" cy="236" rx="56" ry="9" fill="#1E1838" opacity=".26"/>
  <circle cx="110" cy="104" r="104" fill="url(#mGlow)"/>

  <!-- arms -->
  <path d="M44 150 q-26 -2 -30 -26 q-1 -8 7 -8 q8 0 9 8 q2 12 16 14 z" fill="url(#mArm)"/>
  <circle cx="18" cy="116" r="11" fill="#FBD46B"/>
  <circle cx="18" cy="116" r="11" fill="#fff" opacity=".0"/>
  <path d="M14 112 q4 -6 9 -1" stroke="#E0982E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M176 150 q26 -8 26 -34 q0 -8 -8 -8 q-8 0 -8 8 q0 16 -18 20 z" fill="url(#mArm)"/>
  <circle cx="202" cy="104" r="11" fill="#FBD46B"/>

  <!-- screw base -->
  <path d="M86 188 h48 v10 q0 8 -8 8 h-32 q-8 0 -8 -8 z" fill="url(#mBase)"/>
  <rect x="84" y="176" width="52" height="9" rx="4" fill="#B7C0CD"/>
  <rect x="84" y="186" width="52" height="9" rx="4" fill="#AAB4C2"/>
  <rect x="84" y="176" width="52" height="4" rx="2" fill="#E6ECF3"/>

  <!-- bulb -->
  <path d="M110 22 C158 22 188 58 188 100 C188 132 168 152 150 176 L70 176 C52 152 32 132 32 100 C32 58 62 22 110 22 Z" fill="url(#mBulb)"/>
  <!-- inner warm filament glow, low in the bulb -->
  <path d="M101 162 q9 -15 18 0" stroke="#F4A93C" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
  <!-- glass shine -->
  <path d="M64 70 q14 -28 44 -32" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".75"/>
  <ellipse cx="76" cy="58" rx="9" ry="13" fill="#fff" opacity=".55" transform="rotate(-24 76 58)"/>

  <!-- face -->
  <circle cx="90" cy="98" r="13" fill="#fff"/>
  <circle cx="130" cy="98" r="13" fill="#fff"/>
  <circle cx="92" cy="100" r="6.6" fill="#4a3410"/>
  <circle cx="132" cy="100" r="6.6" fill="#4a3410"/>
  <circle cx="89" cy="96" r="2.4" fill="#fff"/>
  <circle cx="129" cy="96" r="2.4" fill="#fff"/>
  <path d="M92 120 q18 22 36 0 q-18 10 -36 0 z" fill="#7a3a1e"/>
  <path d="M96 124 q14 10 28 0" fill="#EC6E7E"/>
  <circle cx="74" cy="116" r="6" fill="#F58FA0" opacity=".55"/>
  <circle cx="146" cy="116" r="6" fill="#F58FA0" opacity=".55"/>

  <!-- sparkles -->
  <path d="M40 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#FBE08A"/>
  <path d="M182 56 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#FBE08A"/>
</svg>
