<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" width="120" height="96">
  <defs>
    <linearGradient id="crGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE08A"/>
      <stop offset="50%" stop-color="#F2C24E"/>
      <stop offset="100%" stop-color="#E3A52A"/>
    </linearGradient>
    <linearGradient id="crBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4CC63"/>
      <stop offset="100%" stop-color="#D6951F"/>
    </linearGradient>
    <radialGradient id="crGemM" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#FB6AA6"/>
      <stop offset="60%" stop-color="#F0428A"/>
      <stop offset="100%" stop-color="#CC2D6E"/>
    </radialGradient>
    <radialGradient id="crGemC" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#7DE6DE"/>
      <stop offset="60%" stop-color="#2FBCD0"/>
      <stop offset="100%" stop-color="#1E8FC0"/>
    </radialGradient>
  </defs>

  <!-- contact shadow -->
  <ellipse cx="60" cy="88" rx="46" ry="8" fill="#1E1838" opacity=".26"/>

  <!-- crown body: 3 chunky points with rounded valleys -->
  <path d="M12 78
           L18 30 Q19 23 26 28 L45 46
           Q52 52 56 42 L60 18 Q60.5 13 64 18 L74 45
           Q78 54 86 48 L102 28 Q109 23 108 31 L108 78 Z"
        fill="url(#crGold)"/>

  <!-- soft top sheen across upper crown -->
  <path d="M14 58 Q20 30 26 28 L45 46 Q52 52 56 42 L60 18 Q62 16 64 20 L74 45 Q79 53 86 48 L102 28 Q106 25 107 33 L107 48 Q60 38 14 58 Z" fill="#fff" opacity=".18"/>

  <!-- base band -->
  <rect x="10" y="66" width="100" height="22" rx="11" fill="url(#crBand)"/>
  <rect x="15" y="69" width="90" height="5" rx="2.5" fill="#fff" opacity=".22"/>
  <rect x="15" y="83" width="90" height="3" rx="1.5" fill="#FFF1B8" opacity=".4"/>
  <!-- band inner shade -->
  <rect x="10" y="82" width="100" height="6" rx="3" fill="#B5811C" opacity=".20"/>

  <!-- round gem tips -->
  <g>
    <circle cx="18" cy="27" r="6.5" fill="#B5811C" opacity=".25"/>
    <circle cx="18" cy="25" r="6.5" fill="url(#crGemC)"/>
    <circle cx="16" cy="23" r="2.2" fill="#fff" opacity=".7"/>
  </g>
  <g>
    <circle cx="60" cy="15" r="7.5" fill="#B5811C" opacity=".25"/>
    <circle cx="60" cy="13" r="7.5" fill="url(#crGemM)"/>
    <circle cx="57.5" cy="10.5" r="2.6" fill="#fff" opacity=".7"/>
  </g>
  <g>
    <circle cx="102" cy="27" r="6.5" fill="#B5811C" opacity=".25"/>
    <circle cx="102" cy="25" r="6.5" fill="url(#crGemC)"/>
    <circle cx="100" cy="23" r="2.2" fill="#fff" opacity=".7"/>
  </g>

  <!-- center band gem -->
  <g>
    <circle cx="60" cy="78" r="7" fill="#B5811C" opacity=".3"/>
    <circle cx="60" cy="77" r="7" fill="url(#crGemM)"/>
    <circle cx="57.5" cy="74.5" r="2.2" fill="#fff" opacity=".65"/>
  </g>
</svg>
