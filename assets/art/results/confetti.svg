<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <defs>
    <linearGradient id="cfOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCCB80"/><stop offset="100%" stop-color="#F18E55"/></linearGradient>
    <linearGradient id="cfCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5BDAD2"/><stop offset="100%" stop-color="#1E9CC8"/></linearGradient>
    <linearGradient id="cfPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F58CBE"/><stop offset="100%" stop-color="#E5428C"/></linearGradient>
    <linearGradient id="cfViolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#BEA6F0"/><stop offset="100%" stop-color="#8E6FD6"/></linearGradient>
    <linearGradient id="cfGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FBE08A"/><stop offset="100%" stop-color="#EFB939"/></linearGradient>
    <linearGradient id="cfGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9CE3A2"/><stop offset="100%" stop-color="#52BC66"/></linearGradient>
  </defs>

  <!-- rounded-rectangle chips -->
  <g transform="translate(58 46) rotate(-22)"><rect x="-11" y="-6" width="22" height="12" rx="5" fill="url(#cfOrange)"/><rect x="-9" y="-5" width="18" height="3.5" rx="1.7" fill="#fff" opacity=".22"/></g>
  <g transform="translate(402 70) rotate(34)"><rect x="-12" y="-6.5" width="24" height="13" rx="5.5" fill="url(#cfCyan)"/><rect x="-10" y="-5" width="20" height="3.5" rx="1.7" fill="#fff" opacity=".22"/></g>
  <g transform="translate(150 300) rotate(14)"><rect x="-11" y="-6" width="22" height="12" rx="5" fill="url(#cfViolet)"/><rect x="-9" y="-5" width="18" height="3.5" rx="1.7" fill="#fff" opacity=".22"/></g>
  <g transform="translate(330 318) rotate(-30)"><rect x="-10" y="-5.5" width="20" height="11" rx="5" fill="url(#cfPink)"/><rect x="-8" y="-4.5" width="16" height="3" rx="1.5" fill="#fff" opacity=".22"/></g>
  <g transform="translate(440 250) rotate(8)"><rect x="-10" y="-5.5" width="20" height="11" rx="5" fill="url(#cfGold)"/><rect x="-8" y="-4.5" width="16" height="3" rx="1.5" fill="#fff" opacity=".25"/></g>

  <!-- circles -->
  <g transform="translate(120 110)"><circle r="9" fill="url(#cfPink)"/><circle cx="-2.6" cy="-2.6" r="2.6" fill="#fff" opacity=".4"/></g>
  <g transform="translate(360 150)"><circle r="7.5" fill="url(#cfGreen)"/><circle cx="-2.2" cy="-2.2" r="2.2" fill="#fff" opacity=".4"/></g>
  <g transform="translate(248 64)"><circle r="8" fill="url(#cfGold)"/><circle cx="-2.4" cy="-2.4" r="2.4" fill="#fff" opacity=".45"/></g>
  <g transform="translate(76 226)"><circle r="7" fill="url(#cfCyan)"/><circle cx="-2" cy="-2" r="2" fill="#fff" opacity=".4"/></g>
  <g transform="translate(300 240)"><circle r="6" fill="url(#cfViolet)"/><circle cx="-1.8" cy="-1.8" r="1.8" fill="#fff" opacity=".4"/></g>

  <!-- tilted squares -->
  <g transform="translate(196 156) rotate(28)"><rect x="-8" y="-8" width="16" height="16" rx="3.5" fill="url(#cfGreen)"/><rect x="-6" y="-6" width="12" height="4" rx="2" fill="#fff" opacity=".2"/></g>
  <g transform="translate(414 320) rotate(-18)"><rect x="-7.5" y="-7.5" width="15" height="15" rx="3.5" fill="url(#cfCyan)"/><rect x="-5.5" y="-5.5" width="11" height="3.5" rx="1.7" fill="#fff" opacity=".2"/></g>
  <g transform="translate(40 150) rotate(40)"><rect x="-7" y="-7" width="14" height="14" rx="3" fill="url(#cfPink)"/></g>

  <!-- streamers (curved rounded ribbons) -->
  <path d="M30 300 C42 280 30 264 44 246" fill="none" stroke="url(#cfViolet)" stroke-width="7" stroke-linecap="round"/>
  <path d="M452 130 C440 112 454 98 442 80" fill="none" stroke="url(#cfOrange)" stroke-width="7" stroke-linecap="round"/>
  <path d="M214 252 C228 238 216 222 230 208" fill="none" stroke="url(#cfGold)" stroke-width="6" stroke-linecap="round"/>

  <!-- squiggles -->
  <path d="M270 110 q10 -10 20 0 q10 10 20 0" fill="none" stroke="url(#cfCyan)" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 60 q9 -9 18 0 q9 9 18 0" fill="none" stroke="url(#cfGreen)" stroke-width="5" stroke-linecap="round"/>
  <path d="M340 290 q8 -8 16 0 q8 8 16 0" fill="none" stroke="url(#cfPink)" stroke-width="5" stroke-linecap="round"/>

  <!-- 4-point sparkles -->
  <g transform="translate(176 70)"><path d="M0 -11 C1.4 -3.4 3.4 -1.4 11 0 C3.4 1.4 1.4 3.4 0 11 C-1.4 3.4 -3.4 1.4 -11 0 C-3.4 -1.4 -1.4 -3.4 0 -11 Z" fill="url(#cfGold)"/></g>
  <g transform="translate(388 224)"><path d="M0 -9 C1.2 -2.8 2.8 -1.2 9 0 C2.8 1.2 1.2 2.8 0 9 C-1.2 2.8 -2.8 1.2 -9 0 C-2.8 -1.2 -1.2 -2.8 0 -9 Z" fill="#fff" opacity=".9"/></g>
  <g transform="translate(146 200)"><path d="M0 -8 C1 -2.5 2.5 -1 8 0 C2.5 1 1 2.5 0 8 C-1 2.5 -2.5 1 -8 0 C-2.5 -1 -1 -2.5 0 -8 Z" fill="url(#cfOrange)"/></g>
  <g transform="translate(286 196)"><path d="M0 -7 C0.9 -2.2 2.2 -0.9 7 0 C2.2 0.9 0.9 2.2 0 7 C-0.9 2.2 -2.2 0.9 -7 0 C-2.2 -0.9 -0.9 -2.2 0 -7 Z" fill="url(#cfViolet)"/></g>

  <!-- small dots for sprinkle -->
  <circle cx="240" cy="320" r="3.5" fill="url(#cfGold)"/>
  <circle cx="60" cy="100" r="3" fill="url(#cfCyan)"/>
  <circle cx="430" cy="40" r="3" fill="url(#cfPink)"/>
  <circle cx="330" cy="46" r="2.6" fill="url(#cfGreen)"/>
</svg>
