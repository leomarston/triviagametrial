<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 104" width="380" height="104" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bpBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE08A"/>
      <stop offset="52%" stop-color="#F2BE52"/>
      <stop offset="100%" stop-color="#E3A52A"/>
    </linearGradient>
    <linearGradient id="bpSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- contact shadow -->
  <ellipse cx="190" cy="98" rx="168" ry="9" fill="#1E1838" opacity=".26"/>
  <!-- darker under-edge to read as a thick rounded edge -->
  <rect x="2" y="6" width="376" height="94" rx="30" fill="#C98C1C"/>
  <!-- body -->
  <rect x="2" y="2" width="376" height="94" rx="30" fill="url(#bpBody)"/>
  <!-- inner-bottom shade hugging lower edge -->
  <path d="M2 70 H378 V66 C378 84 364 96 348 96 H32 C16 96 2 84 2 66 Z" fill="#C9851A" opacity=".30"/>
  <!-- top sheen band (~18%) -->
  <rect x="18" y="12" width="344" height="34" rx="17" fill="url(#bpSheen)"/>
  <!-- subtle 2px lighter inner rim -->
  <rect x="6" y="6" width="368" height="86" rx="26" fill="none" stroke="#FFF4CF" stroke-opacity=".55" stroke-width="2"/>
</svg>
