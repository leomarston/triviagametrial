<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" preserveAspectRatio="xMinYMid slice">
  <defs>
    <linearGradient id="aBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDD08A"/>
      <stop offset="52%" stop-color="#F7A865"/>
      <stop offset="100%" stop-color="#EF8B50"/>
    </linearGradient>
    <linearGradient id="aPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2A860"/>
      <stop offset="100%" stop-color="#DE7B42"/>
    </linearGradient>
    <linearGradient id="aSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="150" rx="26" fill="url(#aBody)"/>
  <!-- broad soft swoosh sweeping across the body -->
  <path d="M0 96 C 150 60 360 132 640 70 L640 150 L0 150 Z" fill="#C9622E" opacity=".22"/>
  <path d="M0 60 C 180 30 380 96 640 44 L640 8 L0 8 Z" fill="#fff" opacity=".16"/>
  <!-- top sheen band -->
  <rect x="14" y="9" width="612" height="40" rx="20" fill="url(#aSheen)" opacity=".5"/>
  <!-- left letter panel -->
  <path d="M26 0 H150 V150 H26 A26 26 0 0 1 0 124 V26 A26 26 0 0 1 26 0 Z" fill="url(#aPanel)"/>
  <rect x="0.5" y="0.5" width="149.5" height="149" fill="none"/>
  <line x1="150" y1="16" x2="150" y2="134" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <line x1="152" y1="16" x2="152" y2="134" stroke="#C9622E" stroke-opacity=".22" stroke-width="2"/>
  <!-- panel inner sheen -->
  <rect x="14" y="10" width="124" height="34" rx="16" fill="#fff" opacity=".14"/>
</svg>
