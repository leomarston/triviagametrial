<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="rbTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#63BCEC"/><stop offset="100%" stop-color="#2E8FD0"/>
    </linearGradient>
    <linearGradient id="rbHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF2F8"/><stop offset="100%" stop-color="#C2D2E2"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="20" fill="url(#rbTile)"/>
  <rect x="8" y="14" width="64" height="22" rx="11" fill="#fff" opacity=".08"/>
  <!-- antenna -->
  <rect x="38" y="12" width="4" height="10" rx="2" fill="#9FB0C2"/>
  <circle cx="40" cy="11" r="4.5" fill="#FFE26B"/>
  <circle cx="40" cy="11" r="2" fill="#fff" opacity=".7"/>
  <!-- head -->
  <rect x="18" y="22" width="44" height="40" rx="14" fill="url(#rbHead)"/>
  <rect x="18" y="22" width="44" height="14" rx="14" fill="#fff" opacity=".4"/>
  <!-- screen -->
  <rect x="24" y="30" width="32" height="22" rx="9" fill="#2B3A4A"/>
  <circle cx="33" cy="41" r="5.5" fill="#5BE0D6"/>
  <circle cx="47" cy="41" r="5.5" fill="#5BE0D6"/>
  <circle cx="34.4" cy="39.6" r="1.6" fill="#fff"/>
  <circle cx="48.4" cy="39.6" r="1.6" fill="#fff"/>
  <!-- mouth grille -->
  <rect x="30" y="55" width="20" height="6" rx="3" fill="#9FB0C2"/>
  <rect x="33" y="55" width="2.5" height="6" fill="#7E8FA1"/>
  <rect x="39" y="55" width="2.5" height="6" fill="#7E8FA1"/>
  <rect x="45" y="55" width="2.5" height="6" fill="#7E8FA1"/>
</svg>
