<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="sciLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67D98A"/><stop offset="100%" stop-color="#2FA557"/>
    </linearGradient>
    <linearGradient id="sciGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".5"/><stop offset="100%" stop-color="#CFE9DA" stop-opacity=".25"/>
    </linearGradient>
    <clipPath id="bulbClip"><circle cx="80" cy="98" r="40"/></clipPath>
  </defs>
  <ellipse cx="80" cy="150" rx="44" ry="8" fill="#1E1838" opacity=".26"/>
  <!-- bubbles escaping -->
  <circle cx="98" cy="28" r="5" fill="#8DE3A6" opacity=".8"/>
  <circle cx="108" cy="16" r="3.4" fill="#8DE3A6" opacity=".7"/>
  <circle cx="92" cy="14" r="2.6" fill="#8DE3A6" opacity=".6"/>
  <!-- stopper -->
  <path d="M70 14 h20 l-2 12 h-16 z" fill="#C98A4E"/>
  <path d="M70 14 h20 v4 h-20 z" fill="#E0A567"/>
  <!-- neck -->
  <rect x="70" y="24" width="20" height="34" fill="url(#sciGlass)"/>
  <!-- bulb glass -->
  <circle cx="80" cy="98" r="40" fill="url(#sciGlass)"/>
  <!-- liquid -->
  <g clip-path="url(#bulbClip)">
    <path d="M40 86 q12 -8 22 0 t22 0 t22 0 t14 0 V140 H40 Z" fill="url(#sciLiq)"/>
    <circle cx="62" cy="116" r="5" fill="#9DEBB2" opacity=".7"/>
    <circle cx="92" cy="108" r="3.5" fill="#9DEBB2" opacity=".7"/>
    <circle cx="78" cy="126" r="3" fill="#9DEBB2" opacity=".6"/>
  </g>
  <!-- glass rim + shine -->
  <circle cx="80" cy="98" r="40" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="2.5"/>
  <path d="M52 84 a40 40 0 0 1 14 -16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/>
  <!-- face on the liquid -->
  <circle cx="70" cy="100" r="8" fill="#fff"/>
  <circle cx="92" cy="100" r="8" fill="#fff"/>
  <circle cx="71" cy="101" r="4" fill="#214a2c"/>
  <circle cx="93" cy="101" r="4" fill="#214a2c"/>
  <circle cx="69.4" cy="99.4" r="1.5" fill="#fff"/>
  <circle cx="91.4" cy="99.4" r="1.5" fill="#fff"/>
  <path d="M71 112 q9 7 18 0" fill="none" stroke="#214a2c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="110" r="3.4" fill="#fff" opacity=".25"/>
  <circle cx="98" cy="110" r="3.4" fill="#fff" opacity=".25"/>
</svg>
