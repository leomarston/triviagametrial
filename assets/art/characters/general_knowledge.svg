  <circle cx="97" cy="74" r="18" fill="#FBF3E2"/>
  <circle cx="64.5" cy="76" r="8.5" fill="#2E2236"/>
  <circle cx="98.5" cy="76" r="8.5" fill="#2E2236"/>
  <circle cx="61" cy="72" r="3" fill="#fff"/>
  <circle cx="95" cy="72" r="3" fill="#fff"/>
  <!-- scholarly glasses -->
  <g fill="none" stroke="#3A2E1E" stroke-width="3">
    <circle cx="63" cy="74" r="19"/>
    <circle cx="97" cy="74" r="19"/>
    <path d="M82 74 h-4 M78 74 a4 5 0 0 1 4 0"/>
