<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trivia Quest</title>
<meta name="description" content="Trivia Quest — a polished party-trivia game across six categories.">
<meta name="theme-color" content="#3A2F5C">
<link rel="icon" href="assets/icon.png">
<style>html,body{background:#2E2548}</style>
<link rel="stylesheet" href="styles/fonts.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/menu.css">
<link rel="stylesheet" href="styles/pregame.css">
<link rel="stylesheet" href="styles/game.css">
<link rel="stylesheet" href="styles/results.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="progGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F84C8C"/><stop offset="100%" stop-color="#FF6E63"/>
  </linearGradient>
</defs></svg>

<div id="frame">

  <!-- ===================== MENU ===================== -->
  <section id="screen-menu" class="screen">
    <div class="menu-decor" id="menuDecor"></div>
    <div class="menu-inner">
      <div class="logo">
        <img class="logo-mascot" src="assets/art/brand/mascot.svg" alt="">
        <div class="logo-words">
          <div class="logo-ribbon"></div>
          <h1 class="logo-title"><span>TRIVIA</span><em>QUEST</em></h1>
          <div class="logo-tag">The party brain-buster</div>
        </div>
      </div>
      <nav class="menu-buttons">
        <button class="btn btn-primary" data-act="play"><span>PLAY</span></button>
        <button class="btn btn-secondary" data-act="settings"><span>SETTINGS</span></button>
        <button class="btn btn-secondary" data-act="quit"><span>QUIT</span></button>
      </nav>
    </div>
    <div class="menu-foot"><span id="bestLine">Best score: —</span><span class="menu-ver">v1.0</span></div>
  </section>

  <!-- ===================== SETTINGS ===================== -->
  <section id="screen-settings" class="screen">
    <div class="sheet">
      <header class="sheet-head">
        <button class="round-btn" data-act="back-menu" aria-label="Back"><img class="ico-back" src="assets/art/ui/arrow_back.svg" alt=""></button>
        <h2>Settings</h2><span class="spacer"></span>
      </header>
      <div class="settings-list">
        <div class="set-row"><div class="set-label">Sound Effects</div><button class="toggle" data-set="sound"></button></div>
        <div class="set-row"><div class="set-label">Music</div><button class="toggle" data-set="music"></button></div>
        <div class="set-row"><div class="set-label">Question Timer</div><button class="toggle" data-set="timer"></button></div>
        <div class="set-row"><div class="set-label">Seconds per question</div>
          <div class="stepper-group"><button class="step" data-step="secs" data-dir="-1">–</button>
          <span class="step-val" id="secsVal">20</span>
          <button class="step" data-step="secs" data-dir="1">+</button></div></div>
        <div class="set-row"><div class="set-label">Fullscreen</div><button class="toggle" data-set="fullscreen"></button></div>
      </div>
      <button class="btn btn-primary wide" data-act="back-menu"><span>DONE</span></button>
    </div>
  </section>

  <!-- ===================== PREGAME ===================== -->
  <section id="screen-pregame" class="screen">
    <header class="pg-head">
      <button class="round-btn" data-act="back-menu" aria-label="Back"><img class="ico-back" src="assets/art/ui/arrow_back.svg" alt=""></button>
      <h2>Set Up Your Quiz</h2><span class="spacer"></span>
    </header>

    <div class="pg-section-label">Pick a category</div>
    <div class="cat-row" id="catRow"></div>

    <div class="pg-grid">
      <div class="pg-card">
        <div class="pg-card-label">Questions</div>
        <div class="stepper-group"><button class="step" data-step="num" data-dir="-1">–</button>
          <span class="step-val" id="numVal">10</span>
          <button class="step" data-step="num" data-dir="1">+</button></div>
      </div>
      <div class="pg-card">
        <div class="pg-card-label">Difficulty</div>
        <div class="chip-row" id="diffRow">
          <button class="chip2" data-diff="easy">Easy</button>
          <button class="chip2" data-diff="normal">Normal</button>
          <button class="chip2" data-diff="hard">Hard</button>
          <button class="chip2 on" data-diff="mixed">Mixed</button>
        </div>
      </div>
      <div class="pg-card">
        <div class="pg-card-label">Mode</div>
        <div class="chip-row" id="modeRow">
          <button class="chip2 on" data-mode="solo">Solo vs Bots</button>
          <button class="chip2" data-mode="pass">Pass &amp; Play</button>
        </div>
      </div>
    </div>

    <div class="pg-players">
      <div class="pg-players-head">
        <span class="pg-card-label">Players</span>
        <div class="stepper-group small"><button class="step" data-step="players" data-dir="-1">–</button>
          <span class="step-val" id="playersVal">3</span>
          <button class="step" data-step="players" data-dir="1">+</button></div>
      </div>
      <div class="player-slots" id="playerSlots"></div>
    </div>

    <button class="btn btn-green wide pg-start" data-act="start"><span>START GAME</span></button>
  </section>

  <!-- ===================== GAME ===================== -->
  <section id="screen-game" class="screen">
    <div class="qtimer" id="qtimer"><div class="qtimer-fill" id="qtimerFill"></div></div>
    <div class="topbar" id="topbar"></div>
    <div class="question-wrap"><h1 class="question" id="question"></h1></div>
    <div class="answers" id="answers"></div>
    <div class="turn-flag" id="turnFlag"></div>
    <div class="pause-overlay" id="pause">
      <div class="pause-card">
        <h2>Paused</h2>
        <button class="btn btn-green" data-act="resume"><span>RESUME</span></button>
        <button class="btn btn-secondary" data-act="quit-menu"><span>QUIT TO MENU</span></button>
      </div>
    </div>
  </section>

  <!-- ===================== LEADERBOARD (between questions) ===================== -->
  <section id="screen-leaderboard" class="screen">
    <h2 class="lb-title">Leaderboard</h2>
    <div class="lb-sub" id="lbSub"></div>
    <div class="lb-list" id="lbList"></div>
    <button class="btn btn-green lb-next" data-act="next-q"><span>NEXT</span></button>
  </section>

  <!-- ===================== RESULTS ===================== -->
  <section id="screen-results" class="screen">
    <img class="res-confetti" src="assets/art/results/confetti.svg" alt="" id="resConfetti">
    <h2 class="res-title" id="resTitle">Results</h2>
    <div class="podium" id="podium"></div>
    <div class="ranking" id="ranking"></div>
    <div class="res-buttons">
      <button class="btn btn-green" data-act="again"><span>PLAY AGAIN</span></button>
      <button class="btn btn-secondary" data-act="setup"><span>CHANGE SETUP</span></button>
      <button class="btn btn-secondary" data-act="menu"><span>MAIN MENU</span></button>
    </div>
  </section>

</div>

<script src="scripts/questions.js"></script>
<script src="scripts/audio.js"></script>
<script src="scripts/app.js"></script>
</body>
</html>
